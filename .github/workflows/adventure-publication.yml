name: Verify v0.1.0 public adventure
on:
  push:
    branches: [codex/v010-public-verification]
    paths:
      - .github/workflows/adventure-publication.yml
      - tooling/verify-v010-publication.mjs
      - docs/evidence/v010-release-manifest.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v010-public-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify published assets and gameplay
        run: |
          export CHROMIUM_PATH="$(node --input-type=module -e 'import {chromium} from "@playwright/test"; console.log(chromium.executablePath())')"
          node tooling/verify-v010-publication.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v010-public-evidence
          path: docs/evidence/v010-public-*
          retention-days: 30
