name: Validate integrated demo
on:
  push:
    branches: [codex/demo-next-stage, codex/v010-adventure, codex/v020-hd2d, codex/map-world-v2, codex/v030-convergence]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: demo-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:boundaries
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser regression
        run: |
          export CHROMIUM_PATH="$(node --input-type=module -e 'import {chromium} from "@playwright/test"; console.log(chromium.executablePath())')"
          npm run test:e2e -- --workers=2 --trace=off
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: demo-validation-evidence
          path: |
            docs/evidence/
            test-results/
            !test-results/**/trace.zip
          retention-days: 14
          if-no-files-found: warn
