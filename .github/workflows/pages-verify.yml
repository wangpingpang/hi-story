name: Verify public demo
on:
  push:
    branches: [codex/fog-bridge-demo]
    paths:
      - .github/workflows/pages-verify.yml
      - tooling/verify-published.mjs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-public-demo
  cancel-in-progress: true
jobs:
  browser:
    if: github.ref == 'refs/heads/codex/fog-bridge-demo'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Play the public Pages site
        shell: bash
        run: |
          export CHROMIUM_PATH="$(node --input-type=module -e 'import {chromium} from "@playwright/test"; console.log(chromium.executablePath())')"
          node tooling/verify-published.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: public-pages-evidence
          path: |
            docs/evidence/pages-smoke.json
            docs/evidence/pages-public-morning.png
          if-no-files-found: warn
          retention-days: 30
